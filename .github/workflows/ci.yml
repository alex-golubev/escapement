# Third-party actions are pinned by commit SHA, not by tag (ADR-0014).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      # The generated code is committed so that a moved field is visible in
      # review (ADR-0013). Here we check that it still is what the schema says.
      # `git diff` alone would miss a file the generator newly creates, so the
      # whole working tree has to come back clean.
      - name: generated code matches the schema
        run: |
          cargo xtask generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the generated code is not what schema/boundary.toml says; run \`cargo xtask generate\`"
            git status --porcelain
            git diff
            exit 1
          fi
      # core::sync::atomic compiles on wasm32 without the atomics feature and
      # lowers to plain loads and stores: code that looks synchronised and is
      # not. Grep for it rather than trust anyone to remember (ADR-0013).
      # The pattern has to survive the spellings that hide the word: a grep for
      # "sync::atomic" alone walks straight past `sync::{atomic::Ordering}`.
      - name: no atomics in the engine
        run: |
          if grep -rnE 'sync::\{?[^}]*atomic|Atomic(Bool|I8|I16|I32|I64|Isize|U8|U16|U32|U64|Usize|Ptr)' crates/; then
            echo "::error::atomics belong on the JavaScript side of the boundary (ADR-0013)"
            exit 1
          fi

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
