name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Any branch, on demand, from the Actions tab.
  #
  # The button appears only once this file is on the **default** branch: a
  # `workflow_dispatch` that exists only on a feature branch is offered
  # nowhere, which reads as the trigger being broken rather than as not having
  # landed yet.
  workflow_dispatch:
    inputs:
      mutants:
        description: "Also run the mutation jobs (slow — every mutant starts a browser)"
        type: boolean
        default: true

# A new push to a pull request makes the run already in flight pointless.
# Without this they pile up and every one of them runs to the end. Not on
# `main`, where each commit's result is worth having on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # What `--in-diff` measures a change against. A pull request names its own
  # base; a manual run has none, and the branch it would have been opened
  # against is the honest stand-in. Dispatched on the default branch itself the
  # range is empty, which cargo-mutants reports and exits 0 on.
  BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}

# The checking jobs are separate jobs rather than more steps in `check`, so
# they run at the same time as it: the wait on a pull request is the longest
# one rather than the sum. They pay for that in runner minutes, since each
# builds its own tree — time to wait and time bought are not the same budget.
#
# Every job carries a timeout because GitHub's default is six hours. The tests
# bound their own waiting from the inside, which is the real fix; this is the
# net under it.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        # Installs the pinned nightly from rust-toolchain.toml, including the
        # rust-src component that build-std needs.
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build for wasm
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # +atomics alone links a private memory and fails only in the browser.
      - name: Shared memory is actually shared
        run: python3 tools/check-shared-memory.py target/wasm32-unknown-unknown/release/*.wasm

      # memory.grow is unbounded, and a quantum at 48 kHz is 2.7 ms (§1).
      - name: The worklet's memory cannot grow
        run: python3 tools/check-shared-memory.py --fixed target/wasm32-unknown-unknown/release/escapement_worklet.wasm

      # `no_std` on our crates stops at the crate boundary; this asks the
      # artifact instead, so a dependency allocating inside itself is caught
      # too. Same pass answers whether anything imported, which is a module
      # `worklet.js` cannot instantiate.
      - name: Nothing imported and no allocator on the audio thread
        run: python3 tools/check-worklet-module.py target/wasm32-unknown-unknown/release/escapement_worklet.wasm


  # Whether a dependency's license permits shipping it to a browser at all.
  # Handing a wasm bundle to a page is distribution of the program (§5.1), so a
  # whole-program copyleft dependency would take the product's own license with
  # it. `deny.toml` is the allow-list, and the bar for adding to it is in that
  # file's header.
  #
  # Its own job rather than a step in `check`: it answers in seconds and has
  # nothing to do with the build, so a failure reads as "a license" instead of
  # arriving twenty minutes into a wasm build.
  #
  # `advisories` is deliberately outside this gate. An advisory published
  # upstream would turn an untouched tree red — the failure mode the dated
  # nightly pin exists to avoid. It is worth running, but on a schedule or by
  # hand, where it does not block a change that has nothing to do with it.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `cargo metadata` reads rust-toolchain.toml like any other cargo call, so
      # the pin is installed here too even though nothing is built.
      - name: Toolchain
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: What may be linked into a bundle
        run: cargo deny check licenses bans sources


  # Undefined behaviour in the two places this project has any: the protocol's
  # one unsafe module, and the worklet's statics — plus whether the deliberate
  # race in the state block is the kind the language permits.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
          # Miri builds a sysroot of its own, and rebuilding it costs more than
          # the run does.
          cache-directories: "~/.cache/miri"

      # Named crates, never --workspace. Miri interprets rather than runs, so
      # its cost follows the code put under it, and only code with `unsafe` or
      # a deliberate race has anything to find. Measured: escapement-core has
      # no `unsafe` at all and takes 36 s against the protocol's 23, because
      # its tests push 48 000 samples through a sine one sample at a time. The
      # worklet is 8 s and paid for itself on its first run, on a test that
      # moved a `Box` after taking a pointer into it.
      - name: Undefined behaviour and data races
        run: tools/miri.sh -p escapement-protocol -p escapement-worklet

  # The half of `escapement-view` no host test can reach: its five `Cells`
  # methods are `Atomics` calls, and there is no `Atomics` on the host. Chrome
  # and ChromeDriver come with the runner image; the test runner serves with the
  # isolation headers itself, so the buffer under the test is a real shared one.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: browser

      # Pinned, and the pin is not free-standing: `wasm-bindgen-test-runner`
      # refuses a module built by a different version of the crate. It has to
      # follow `wasm-bindgen` in Cargo.lock, and the error when it stops
      # matching says so plainly.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # `.cargo/config.toml` names the driver rather than trusting PATH, so the
      # file it names has to exist here too: the image's own chromedriver is no
      # longer what answers. Worth the download for its own sake — this job
      # stops depending on the image shipping a driver whose major matches the
      # Chrome beside it.
      - name: A driver matching this runner's Chrome
        run: python3 tools/chromedriver.py

      # The target is what selects the runner from .cargo/config.toml, and it is
      # also what engages build-std — wanted here, unlike under `cargo miri`.
      - name: Whether Atomics carry the protocol at all
        run: cargo test -p escapement-view -p escapement-app --target wasm32-unknown-unknown

  # What the two-thread stress tests cannot check: that the orderings hold
  # under every interleaving the memory model permits, rather than under the
  # one that happened on this machine today.
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: loom

      # A different RUSTFLAGS is a different build, hence the separate cache
      # key above. Loom grows combinatorially inside a model, so what keeps
      # this bounded is the models being tiny and preemption-bounded, not
      # anything here.
      - name: Memory orderings under every interleaving
        run: cargo test -p escapement-protocol
        env:
          RUSTFLAGS: --cfg loom

  # Whether the tests would notice if this code stopped working — but only for
  # the lines the change touched. A full run is three minutes today and
  # grows as (number of mutants) x (time to run the tests), so it is the one
  # cost here that does not stay put as the project does. `--in-diff` makes it
  # follow the size of the change instead.
  mutants:
    if: github.event_name == 'pull_request' || inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # --in-diff needs the base branch present to diff against.
          fetch-depth: 0

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      # A prebuilt binary. `cargo install` inside the repository picks up the
      # pinned nightly, and building a host tool with it is neither wanted nor
      # reliable (`.claude/rules/wasm-build.md`).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: What this change touches
        run: git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff

      # Not -p: as other crates grow, a change in them should be held to the
      # same standard. Mutants that survive by construction rather than by a
      # gap are listed in .cargo/mutants.toml.
      #
      # Before the work rather than after it: the split this job is half of is
      # only correct in pairs, and nothing about either half shows that.
      - name: The two runs still add up
        run: python3 tools/mutants.py check

      # Which crates this run leaves to the job below, and why, is in
      # tools/mutants.py — one place, so that what is checked above and what
      # runs here cannot become two different things.
      - name: Do the tests test the new code
        run: python3 tools/mutants.py host --in-diff /tmp/pr.diff

  # The other half of the job above. Its own job rather than a second step
  # there, for the reason at the top of this file: separate jobs wait in
  # parallel and pay in runner minutes instead.
  mutants-browser:
    if: github.event_name == 'pull_request' || inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-browser

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,wasm-bindgen-cli@0.2.127

      - name: What this change touches
        run: git diff "origin/${BASE_REF}...HEAD" > /tmp/pr.diff

      # `.cargo/config.toml` names the driver rather than trusting PATH, so the
      # file it names has to exist here too: the image's own chromedriver is no
      # longer what answers. Worth the download for its own sake — this job
      # stops depending on the image shipping a driver whose major matches the
      # Chrome beside it.
      - name: A driver matching this runner's Chrome
        run: python3 tools/chromedriver.py

      # The target is what makes this run the browser tests, and it is also
      # what makes it run the ordinary ones: they carry an aliased attribute so
      # that both halves run in both places. Without that, each of the two runs
      # leaves the other's half alive — measured at fourteen and two.
      #
      # A longer timeout than the host job because every mutant starts a
      # browser, not because the tests grew.
      - name: Do the tests test the new code, where only a browser can
        run: python3 tools/mutants.py browser --in-diff /tmp/pr.diff
