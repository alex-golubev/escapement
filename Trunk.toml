[build]
target = "web/index.html"
dist = "dist"

# The worklet is built here rather than by a `data-trunk rel="rust"` link,
# because it must come out as raw wasm with no glue around it. The script says
# why, and runs the checks the audio thread's module has to pass.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["tools/build-worklet.sh"]

[watch]
ignore = ["dist", "target"]

[serve]
port = 8080
open = false

# Without these there is no SharedArrayBuffer, and the failure looks like broken
# wasm. Production hosting must send the same headers.
[serve.headers]
"Cross-Origin-Opener-Policy" = "same-origin"
"Cross-Origin-Embedder-Policy" = "require-corp"
