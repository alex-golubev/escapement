[package]
name = "escapement-protocol"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# The audio thread depends on this crate, so it stays `no_std`: nothing here can
# reach for an allocator by accident. The outside half's access lives in
# `escapement-view` rather than behind a feature here — cargo unifies features
# across a workspace build, so a feature would have put `js-sys` in the worklet.
[dependencies]

# Only under `--cfg loom`, so it is absent from every ordinary build and can
# never reach the bundle. MIT, like everything else here.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Everything here is `warn`; CI runs clippy with `-D warnings`, so it is `deny`
# where it matters and merely loud while working. `unsafe_code` is the exception
# and lives in `lib.rs`, because its one exemption belongs next to it.
#
# This crate is a contract between two separately compiled modules, and the half
# that reads a value cannot ask the half that wrote it what it meant. So the
# things that are ordinarily a matter of taste — a documented public item, a
# named panic, a named error — are the contract, and are checked rather than
# remembered.
# Repeated from the workspace rather than inherited: cargo refuses a manifest
# that both takes `workspace.lints` and adds to it, and this crate has lints of
# its own that the others do not want.
[lints.rust]
unused_qualifications = "warn"
missing_docs = "warn"
# `loom` is ours, not the compiler's; without this the build warns about an
# unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
undocumented_unsafe_blocks = "warn"
