[package]
name = "escapement-model"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# For `SampleRate`, which an audio file needs to say how long it is: the frames
# in a file are counted at the file's own rate and at nothing else (§2.5).
escapement-time.workspace = true
# The CRDT the document is, chosen over Loro on weight, licensing and a format
# with more than one implementation (D18). MIT. It reaches no other crate: the
# worklet links `core`, `protocol` and `time`, so nothing of this arrives on the
# audio thread.
yrs = "0.27"

# The properties of the rank are the reason this crate exists in the shape it
# does, and a handful of written-down keys cannot state them: what has to hold
# is "for any two keys", over the ones nobody would think to type. §7 names this
# as the first thing proptest is for. MIT/Apache-2.0.
#
# `default-features = false` drops `fork`, `timeout` and `bit-set` — the first
# two run each case in a subprocess, which buys catching a segfault in code that
# has `#![forbid(unsafe_code)]` on it.
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
