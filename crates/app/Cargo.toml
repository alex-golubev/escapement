[package]
name = "escapement-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# The offline render, whole: the engine, the blocks it is driven in and the
# file it goes into all live behind one call there (ARCHITECTURE.md §7).
escapement-export.workspace = true
# For the two constants the page's controls start at. They are a fact about the
# engine, and a literal in the markup is a second copy nothing keeps true.
escapement-core.workspace = true
escapement-model.workspace = true
escapement-render.workspace = true
escapement-view.workspace = true
# The interface module is the one that goes through `wasm-bindgen`, and the
# check below needs the handle to its own memory. MIT/Apache-2.0.
wasm-bindgen = "0.2"

# Only the tests below want these, and only a browser can run them: whether the
# memory came out shared is not a question a build can answer.
[dev-dependencies]
# The test below has to play the engine's part — write a header, drain the ring,
# publish a state block — and that is the protocol's own machinery.
escapement-protocol.workspace = true
js-sys = "0.3"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
