[package]
name = "escapement-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
escapement-model.workspace = true
escapement-render.workspace = true
escapement-view.workspace = true
# The interface module is the one that goes through `wasm-bindgen`, and the
# probe below needs the handle to its own memory. MIT/Apache-2.0.
wasm-bindgen = "0.2"

# Only the check below wants these, and only a browser can run it: whether the
# memory came out shared is not a question a build can answer.
[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"
# leptos = "*"

[lints]
workspace = true
