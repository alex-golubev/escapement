[package]
name = "escapement-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

# The outside half of `escapement-protocol`, in a crate of its own because
# measurement said so rather than because the layout looked tidier — the reason
# is in the commit that split it.
#
# Not `no_std`, unlike the two crates it sits beside. That attribute is there to
# keep a heap off the audio thread, and nothing here runs on it; declaring it
# anyway would be the attribute travelling past its reason.
[dependencies]
escapement-protocol.workspace = true
# `default-features = false` on both: with `std` they bring one in.
# MIT/Apache-2.0.
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }

# Only the browser half wants this, and only the browser can run it — the five
# methods below `Cells` are `Atomics` calls and nothing else, so a host test
# cannot reach them at all. MIT/Apache-2.0.
[dev-dependencies]
wasm-bindgen-test = "0.3"

# Repeated from the workspace rather than inherited, as in `escapement-protocol`
# and for its reason: this crate is one end of a contract between two separately
# compiled modules, so a documented public item and a named error are the
# contract rather than a matter of taste.
[lints.rust]
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
