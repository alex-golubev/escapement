[package]
name = "escapement-export"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# The one crate here that may allocate on purpose. It runs where a person is
# waiting for a file rather than where a quantum is due, so the rules in
# `.claude/rules/rt-safety.md` govern what it drives and not what it is.
[dependencies]
escapement-core.workspace = true
# For the one type this crate reads rather than writes: what the engine
# publishes about itself. No `js-sys` and no features, so it costs the same
# here as it does in the worklet.
escapement-protocol.workspace = true
escapement-time.workspace = true

[lints]
workspace = true
