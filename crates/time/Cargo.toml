[package]
name = "escapement-time"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# One, and it is the same one and for the same reason `escapement-core` carries
# it: a tempo ramp is a logarithm and its inverse an exponential (§2.5), and
# both are `std` methods. Anything arriving here arrives on the audio thread, so
# the bar is that: MIT/Apache-2.0, no allocation, no dependencies of its own.
[dependencies]
libm = "0.2"

# Repeated from the workspace rather than inherited: a crate cannot have both
# `lints.workspace` and a table of its own.
[lints.rust]
unused_qualifications = "warn"

# The audio thread's crates carry one lint the rest do not. An index the
# compiler cannot discharge is a panic; a panic carries a formatted message; a
# formatted message is a `String`, and a `String` is the allocator that must not
# be in the worklet's module. `.claude/rules/rt-safety.md` has the measurement.
# `tools/check-worklet-module.py` catches it in the built artifact, a dozen
# calls from the cause — this catches it where it is written.
[lints.clippy]
indexing_slicing = "warn"
