[package]
name = "escapement-worklet"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
escapement-core.workspace = true
escapement-protocol.workspace = true

# For `SampleRate` alone: the host hands this module a number, and this is the
# boundary where a number that is not a rate has to be turned away.
escapement-time.workspace = true

# Tests only, and one test: the offline render has to be compared against the
# online one, and the online one is this crate's `Processor`. Nothing of it
# reaches the module that ships — `tools/check-worklet-module.py` reads that.
[dev-dependencies]
escapement-export.workspace = true
# The document both paths are driven from: the ring is told what it says, and
# the file is rendered from the same value (D24).
escapement-model.workspace = true

# Repeated from the workspace rather than inherited: a crate cannot have both
# `lints.workspace` and a table of its own.
[lints.rust]
unused_qualifications = "warn"

# The audio thread's crates carry one lint the rest do not. An index the
# compiler cannot discharge is a panic; a panic carries a formatted message; a
# formatted message is a `String`, and a `String` is the allocator that must not
# be in the worklet's module. `.claude/rules/rt-safety.md` has the measurement.
# `tools/check-worklet-module.py` catches it in the built artifact, a dozen
# calls from the cause — this catches it where it is written.
[lints.clippy]
indexing_slicing = "warn"
