[package]
name = "escapement-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

# Anything that allocates on the processing path does not belong here, and
# `no_std` in `lib.rs` is what enforces it.
#
# The one dependency is the cost of that: `f32::sin` is a `std` method. On
# wasm it is not the platform's sine either — `std` routes it to
# `compiler_builtins::math::libm_math::sinf`, which is this library, visible by
# name in the built module. So on the target this changes nothing and only
# makes the host build agree with what ships. MIT/Apache-2.0, no allocation,
# no dependencies of its own.
[dependencies]
libm = "0.2"

# Where the engine meets the clock (`.claude/rules/musical-time.md`): a sample
# rate is a validated type rather than a number travelling by convention, and
# the conversions the sequencer will need are already there. `no_std`, no
# allocation, and its own dependency is the `libm` above.
escapement-time.workspace = true

# Repeated from the workspace rather than inherited: a crate cannot have both
# `lints.workspace` and a table of its own.
[lints.rust]
unused_qualifications = "warn"

# The audio thread's crates carry one lint the rest do not. An index the
# compiler cannot discharge is a panic; a panic carries a formatted message; a
# formatted message is a `String`, and a `String` is the allocator that must not
# be in the worklet's module. `.claude/rules/rt-safety.md` has the measurement.
# `tools/check-worklet-module.py` catches it in the built artifact, a dozen
# calls from the cause — this catches it where it is written.
[lints.clippy]
indexing_slicing = "warn"
