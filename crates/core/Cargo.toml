[package]
name = "escapement-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

# Anything that allocates on the processing path does not belong here, and
# `no_std` in `lib.rs` is what enforces it.
#
# The one dependency is the cost of that: `f32::sin` is a `std` method. On
# wasm it is not the platform's sine either — `std` routes it to
# `compiler_builtins::math::libm_math::sinf`, which is this library, visible by
# name in the built module. So on the target this changes nothing and only
# makes the host build agree with what ships. MIT/Apache-2.0, no allocation,
# no dependencies of its own.
[dependencies]
libm = "0.2"

[lints]
workspace = true
