# SPDX-License-Identifier: Apache-2.0
#
# The single source for the engine boundary (ADR-0011, ADR-0013, ADR-0015).
#
# Offsets are written here and never computed. The generator checks them for
# alignment and overlap, emits them into both languages, and emits static
# assertions so that rustc, not this file, has the final word.
#
# Anything of variable length, anything optional, and any field that two
# command kinds would share a byte of, is a sign that we have drifted into
# serialization. There is no such thing here on purpose.

[abi]
major = 0

[constants]
# A ring slot is an 8-byte header followed by an opaque payload (ADR-0015).
# The slot's own size belongs to records.command_slot and is not repeated here:
# one number, one place.
command_payload_offset = 8
command_payload_size = 24

# The staging area is a static in the wasm host (ADR-0020), so how many slots it
# holds is fixed when the code is compiled. Here rather than in the engine,
# because the glue fills it and would otherwise have to be told.
command_staging_capacity = { value = 256, doc = """
How many command slots the staging area holds. The glue copies at most this
many into it in one block and leaves the rest in the ring for the next, so
`process` seeing more than this is a bug in the glue rather than a busy
moment.""" }

# Both halves judge a tempo — TypeScript before it writes the command, the
# engine when it decodes one — so the bounds are one pair of numbers rather than
# two criteria chosen separately. ADR-0011 counts musical time constants among
# what this file describes; the tick resolution and the tempo map follow when
# there is something to play.
micro_bpm_min = { value = 10_000_000, doc = "The slowest tempo the engine accepts, in micro-BPM: 10 BPM." }
micro_bpm_max = { value = 999_000_000, doc = "The fastest tempo the engine accepts, in micro-BPM: 999 BPM." }

[enums.command_kind]
play = 1
stop = 2
set_tempo = 3

# Every way a call into the engine can fail, so that the engine never has to
# invent a number the TypeScript half does not know. What the codes mean for
# the caller is on `process` and `init`, which return them.
[enums.engine_error]
ok = { value = 0, doc = "The call did what it was asked." }
unknown_command_kind = { value = 1, doc = "A slot carried a kind the engine does not know." }
bad_frame_count = { value = 2, doc = "A block of more frames than a plane of `audio_out` holds." }
bad_sample_rate = { value = 3, doc = "A sample rate that is not a positive, finite number." }
not_initialised = { value = 4, doc = "`process` before a successful `init`." }
too_many_commands = { value = 5, doc = "More commands than the staging area holds." }
bad_command_payload = { value = 6, doc = "A command of a kind the engine knows, carrying a value it cannot use." }
bad_frame_offset = { value = 7, doc = "A command placed at or beyond the end of the block it arrived with." }
commands_out_of_order = { value = 8, doc = "A command placed before the one ahead of it in the staging area." }

[enums.transport_state]
stopped = 0
playing = 1

# --- records -----------------------------------------------------------

[records.command_slot]
size = 32
fields = [
  { name = "kind", type = "u32", offset = 0 },
  { name = "frame_offset", type = "u32", offset = 4 },
  { name = "payload", type = "u8", count = 24, offset = 8 },
]

# The block the engine renders into. It is a static in the wasm host, so its
# size is fixed when the code is compiled rather than asked for at init
# (ADR-0020). 1024 frames is eight times the browser's render quantum of 128,
# with room for the larger blocks an offline render asks for; raising it moves
# a plane, which is why it is an ABI change like any other.
[records.audio_out]
size = 8192
doc = """
The block the engine renders into, in its own unshared memory. One run of
samples per channel at a fixed offset: Web Audio hands the worklet a
Float32Array per channel, and an offset is one number rather than a stride each
side works out for itself. A block fills the first `frames` samples of each
plane and leaves the rest of it as the previous block left it."""
fields = [
  { name = "left", type = "f32", count = 1024, offset = 0, doc = "The left channel, as long as the largest block the engine accepts." },
  { name = "right", type = "f32", count = 1024, offset = 4096, doc = "The right channel, as long as the largest block the engine accepts." },
]

# The same four numbers live twice on this boundary, in two kinds of memory
# with two writers, so they are two records (ADR-0020). Keeping one would mean a
# comment carrying a difference the field names contradict.
[records.engine_report]
size = 16
doc = """
What the engine has to say about the block it has just rendered, written into
its own unshared memory. The glue reads it once `process` has returned and
publishes what the interface needs into `meter_block`. The engine never sees
the published copy."""
fields = [
  { name = "position_frames", type = "i32", offset = 0, doc = "The playhead at the end of this block, in frames from the start of the timeline." },
  { name = "peak_amp_micro", type = "i32", offset = 4, doc = """
The largest sample of this block, over both channels, as an amplitude times a
million: 1.0 is 1000000. Linear and not dBFS, because `core` has no logarithm
and the curve to draw is the interface's to choose.""" },
  { name = "transport_state", type = "i32", offset = 8, doc = "The transport as this block left it, one of the `transport_state` codes." },
  { name = "dropped_commands", type = "u32", offset = 12, doc = """
How many of this block's commands the engine dropped, whatever the reason. Per
block rather than cumulative: the host logs it and the count starts again."""
  },
]

# Published by the worklet glue after process() returns, read by the UI every
# frame. The engine itself never touches this memory, which is why the atomic
# fields exist only on the TypeScript side.
[records.meter_block]
size = 16
shared = true
doc = "What the interface reads, in the shared buffer, published by the glue."
fields = [
  { name = "block_counter", type = "i32", offset = 0, atomic = true, doc = "How many blocks the glue has published. The engine does not count blocks." },
  { name = "position_frames", type = "i32", offset = 4, atomic = true, doc = "The playhead as of the published block, in frames from the start of the timeline." },
  { name = "peak_amp_micro", type = "i32", offset = 8, atomic = true, doc = """
The meter to draw, as an amplitude times a million. The glue holds and decays
the engine's per-block peak into this, because the interface reads about once
in six blocks and would otherwise miss the transients; what the interface adds
is the curve, not a second decay.""" },
  { name = "transport_state", type = "i32", offset = 12, atomic = true, doc = "The transport as of the published block, one of the `transport_state` codes." },
]

# --- commands ----------------------------------------------------------
#
# One record per kind, offsets counted from the start of the payload. Two
# kinds never share a layout, so there is nothing to reinterpret.

[commands.play]
fields = [
  { name = "from_frame", type = "u32", offset = 0 },
]

[commands.stop]
fields = []

[commands.set_tempo]
# Integer micro-BPM rather than a float: the document holds exact values and
# the engine must not disagree with the export about the tempo.
fields = [
  { name = "micro_bpm", type = "u32", offset = 0, doc = """
Beats per minute times a million: 120 BPM is 120000000. Between `micro_bpm_min`
and `micro_bpm_max` inclusive — outside them the command is dropped and the
block reports `bad_command_payload`.""" },
]

# --- exports -----------------------------------------------------------

[[exports]]
name = "memory"
kind = "memory"

[[exports]]
name = "abi_version"
params = []
returns = "u32"

[[exports]]
name = "init"
doc = """
Prepares the engine for a sample rate, and returns `ok` or `bad_sample_rate`.
Nothing is sized here: the buffers are statics whose sizes this file states
(ADR-0020)."""
params = [
  { name = "sample_rate", type = "f32" },
]
returns = "u32"

[[exports]]
name = "command_staging_ptr"
params = []
returns = "u32"

[[exports]]
name = "audio_out_ptr"
params = []
returns = "u32"

[[exports]]
name = "engine_report_ptr"
doc = "Where the engine writes its report. Stable for the life of the instance, so the glue takes its view once."
params = []
returns = "u32"

[[exports]]
name = "process"
doc = """
Renders one block. The glue has copied `command_count` slots into the staging
area, in non-decreasing `frame_offset`, each of them below `frames`; `frames`
is at most as many as a plane of `audio_out` holds.

An error is a report, not control flow: a command the engine cannot use is
dropped and counted in `engine_report.dropped_commands`, the block is rendered
regardless, and what comes back is the first code raised (ADR-0002)."""
params = [
  { name = "command_count", type = "u32" },
  { name = "frames", type = "u32" },
]
returns = "u32"
