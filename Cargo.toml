[workspace]
resolver = "2"
members = [
    "crates/time",
    "crates/core",
    "crates/model",
    "crates/protocol",
    "crates/worklet",
    "crates/render",
    "crates/view",
    "crates/app",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["Alex Golubev"]
repository = "https://github.com/alex-golubev/escapement"
license-file = "LICENSE"
# Nothing here goes to crates.io: the license is not an OSI one and the
# crates are parts of one application, not reusable libraries.
publish = false

[workspace.dependencies]
escapement-core = { path = "crates/core" }
escapement-model = { path = "crates/model" }
escapement-protocol = { path = "crates/protocol" }
escapement-render = { path = "crates/render" }
escapement-time = { path = "crates/time" }
escapement-view = { path = "crates/view" }

# A qualification the prelude already provides is a leftover from a crate that
# needed it — `escapement-protocol` is `no_std` and must write `std::boxed::Box`,
# and the idiom travels by copy into crates that do not. The lint tells the two
# apart; CI turns it into an error with `-D warnings`.
[workspace.lints.rust]
unused_qualifications = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The UI is not on the hot path — trade speed for bundle size.
[profile.release.package.escapement-app]
opt-level = "s"
