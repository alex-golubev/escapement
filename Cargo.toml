[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/model",
    "crates/worklet",
    "crates/render",
    "crates/app",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["Alex Golubev"]
repository = "https://github.com/alex-golubev/escapement"

[workspace.dependencies]
escapement-core = { path = "crates/core" }
escapement-model = { path = "crates/model" }
escapement-render = { path = "crates/render" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The UI is not on the hot path — trade speed for bundle size.
[profile.release.package.escapement-app]
opt-level = "s"
