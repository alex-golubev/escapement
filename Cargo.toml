[workspace]
members = ["crates/engine"]
resolver = "3"

[workspace.package]
edition = "2024"
# Proprietary, all rights reserved. `license` takes an SPDX expression, and
# SPDX only names licenses that grant something, so the file is named instead.
license-file = "LICENSE"

# Dependency policy: permissive (MIT, Apache-2.0, BSD, ISC) and MPL-2.0 only.
# GPL, AGPL and LGPL are out — the page ships its JS and WASM to every visitor,
# which is distribution, and copyleft would then oblige us to hand each of them
# the source. Check the license before adding anything, not after.

# Profiles are read ONLY from the workspace root manifest. In a member's
# manifest they are silently ignored.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panic on the audio thread is unacceptable, period.
# Release only: in dev/test, abort breaks the test harness, which needs unwind.
panic = "abort"
