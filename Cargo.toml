[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/alex-golubev/escapement"

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-plugins = { path = "crates/engine-plugins" }
# Same version as flatc in tools/src/gen.ts: the generated code relies on it.
flatbuffers = "=25.12.19"
rtrb = "0.4.0"
serde_json = "1.0.151"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# Together they keep `pub` items to what the crate's root hands out: none that can't be seen from outside, and no type
# seen from outside that can't be named there. A field is as visible as its type.
unreachable_pub = "warn"
unnameable_types = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An exception is an `expect` with a reason, so it speaks up once it is no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
# They want a section on every such function, needed or not; a non-obvious error or panic gets one anyway.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `node` and `note`, the engine's two main words, stand side by side almost everywhere.
similar_names = "allow"
# DSP turns whole numbers into floats on purpose and loses nothing it needs: counts of samples stay below 2²⁴, where an
# `f32` holds every whole number, and noise needs no more than an `f32` holds. Positions, where exactness matters, are
# counted in whole numbers.
cast_precision_loss = "allow"
