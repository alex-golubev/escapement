[target.wasm32-unknown-unknown]
rustflags = [
    # 128-bit only. Autovectorization is unreliable, so hot loops need explicit
    # core::arch::wasm32 intrinsics.
    "-C", "target-feature=+simd128",

    # SharedArrayBuffer needs atomics. These flags change the wasm ABI, so every
    # crate in the link — std included — must be built with them. Hence build-std
    # below; the two go together or not at all.
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",

    # The target-feature flags alone are not enough: they make atomic
    # instructions available but still emit a private, unshared memory. Shared
    # memory has to be asked of the linker — but not from here. rustflags apply
    # to every crate built for the target, and the two modules want different
    # memories: the worklet's is fixed (§1), the UI's grows. The link args live
    # in crates/*/build.rs, which can say it per crate. Target features stay
    # here: they change the ABI and must be uniform across the whole link.
]

[unstable]
# The shipped std is precompiled without atomics and will not link against
# atomics-enabled crates. Rebuilding it from source is the only route; needs the
# rust-src component (pinned in rust-toolchain.toml).
build-std = ["std", "panic_abort"]
