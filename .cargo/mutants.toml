# Run by `pnpm test:mutants`, with the cargo-mutants version it pins.

# A plugin's mutant is caught by the engine's tests too.
test_workspace = true
# The automatic timeout comes from a run of only the mutated packages' tests, though each mutant runs the workspace's:
# for a package with quick tests, it cuts them short. Under the 4 jobs of `pnpm test:mutants` the workspace's tests
# take up to 48 s.
minimum_test_timeout = 120
# Each job's copy of the tree leaves out what git ignores, such as `node_modules`.
gitignore = true

exclude_globs = [
  # Generated by `pnpm gen`.
  "crates/engine-core/src/schema/**",
  # The sizes of the audio thread's stack and thread-local data, which only the worklet reads.
  "crates/engine-wasm/src/audio_thread.rs",
  # Writes the descriptions for `pnpm gen`; a change shows as a diff of the generated code, not in a Rust test.
  "crates/describe-plugins/**",
]

exclude_re = [
  # The exports are the page's to check: the TypeScript tests run them in wasm, which a mutant would have to rebuild.
  'engine-wasm/src/lib\.rs:.*(: replace | in )engine_\w+( |$)',
  # Reached only through the exports: the hook `engine_new` installs, and the text the page reads after a trap.
  'engine-wasm/src/panic_text\.rs:.*\b(install|engine_panic_text)\b',
]
