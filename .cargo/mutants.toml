# Run by `pnpm test:mutants`, with the cargo-mutants version it pins and the timeout it measures. Run by hand,
# cargo-mutants times only the mutated packages' tests, though each mutant runs the workspace's: its 20 s floor covers
# them while they stay quick.

# A plugin's mutant is caught by the engine's tests too.
test_workspace = true
# Each job's copy of the tree leaves out what git ignores, such as `node_modules`.
gitignore = true

exclude_globs = [
  # Generated by `pnpm gen`.
  "crates/engine-core/src/schema/**",
  # The sizes of the audio thread's stack and thread-local data, which only the worklet reads.
  "crates/engine-wasm/src/audio_thread.rs",
  # Writes the descriptions for `pnpm gen`; a change shows as a diff of the generated code, not in a Rust test.
  "crates/describe-plugins/**",
]

exclude_re = [
  # The exports are the page's to check: the TypeScript tests run them in wasm, which a mutant would have to rebuild.
  'engine-wasm/src/lib\.rs:.*(: replace | in )engine_\w+( |$)',
  # Reached only through the exports: the hook `engine_new` installs, and the text the page reads after a trap.
  'engine-wasm/src/panic_text\.rs:.*\b(install|engine_panic_text)\b',
  # Sizes, not logic: events that don't fit are dropped and counted, and the tests take the room from the constant;
  # native memory never runs out, so the pool's headroom only tells in wasm.
  'engine-core/src/events\.rs:[0-9:]+ replace \* with \+$',
  'engine-core/src/pool\.rs:[0-9:]+ replace << with >>$',
  # The same either way: the count stays below the bit it sets.
  'engine-core/src/sequencer\.rs:.*: replace \| with \^ in Held::next_note$',
  # Smoothing a jump or a corner, both sides give the same at the boundary.
  'engine-plugins/src/catalog/synth\.rs:.*: replace (< with <=|> with >=) in (jump|corner)$',
  # The tuning's fast way gives the same numbers as the slow one.
  'engine-plugins/src/catalog/synth\.rs:.*: delete match arm .* in Oscillator::tune$',
  # Skips work only; done anyway, a silent voice would draw on its noise: another stretch of the same white noise.
  'engine-plugins/src/catalog/synth\.rs:.*: replace \|\| with && in Synth::render$',
  # Another mix as good: the seeds still differ, and xorshift goes through every one.
  'engine-plugins/src/catalog/synth\.rs:.*: replace >> with << in Noise::of$',
  # Over the frames a fade has left, nearest silence ranks the voices the same either way.
  'engine-plugins/src/catalog/sampler\.rs:.*: replace - with / in Sampler::start$',
]
